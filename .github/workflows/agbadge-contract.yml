name: AGBadge contract checks

on:
  pull_request:
    branches: [development]
    paths:
      - "contracts/**"
      - "foundry.toml"
      - ".github/workflows/agbadge-contract.yml"
  push:
    branches: [muse/ag-badge-hackathon]
    paths:
      - "contracts/**"
      - "foundry.toml"
      - ".github/workflows/agbadge-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Compile and test AGBadge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install Solidity dependencies
        run: npm ci --prefix contracts

      - name: Compile with pinned npm toolchain
        run: npm run compile --prefix contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run contract tests
        run: forge test -vvv
